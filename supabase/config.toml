# Minimal Supabase CLI config for COMETHICAL. Run `npx supabase init` if you need the full template.
project_id = "comethical"

[api]
enabled = true
port = 54321
schemas = ["public"]

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "comethical://"
additional_redirect_urls = ["comethical://reset-password"]

[auth.email]
enabled = true
enable_confirmations = false

# Player endpoints verify the user JWT inside the function (requireUser) and return
# friendly errors; admin endpoints use the x-admin-key header instead of a user JWT.
[functions.select-scenarios]
verify_jwt = false

[functions.submit-answer]
verify_jwt = false

[functions.complete-session]
verify_jwt = false

[functions.generate-scenarios]
verify_jwt = false

[functions.assess-difficulty]
verify_jwt = false

[functions.validate-scenarios]
verify_jwt = false
